name: Deploy MUSLIM VIDEO GENERATOR to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -r docs/* _site/ 2>/dev/null || true
          cp render.js _site/ 2>/dev/null || true

          if [ ! -f "_site/index.html" ]; then
            cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>MUSLIM VIDEO GENERATOR</title>
          </head>
          <body>
            <h1>MUSLIM VIDEO GENERATOR</h1>
            <p>Application déployée avec GitHub Pages.</p>
          </body>
          </html>
          HTML
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
